name: Docs site build

# Builds website/ on pull requests, and nothing else: pages.yml deploys, and holds the `pages` concurrency
# group and the github-pages environment, which a pull request must not enter. Checks first that the pages
# in website/docs match what website/sync_pages.py builds from README.md, DEVELOPMENT.md and docs/, then
# that the site builds; broken links and anchors fail the build (docusaurus.config.ts).

on:
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - "DEVELOPMENT.md"
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The pages match the README and docs/
        run: |
          python3 website/sync_pages.py
          git diff --exit-code -- website/docs || {
            echo "::error::website/docs is out of date: run python3 website/sync_pages.py and commit the result"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        run: |
          cd website
          npm ci
          npx docusaurus build
