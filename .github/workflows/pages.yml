name: Deploy docs

# Publishes the Docusaurus site in website/ to GitHub Pages: https://hugr-lab.github.io/duck-changepoint/
# Set up as hugr-lab/mssql-extension's docs are. The docs build from main; at a release, the versioning
# contract in website/docusaurus.config.ts keeps the released docs at the root and main's under /next/.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - "DEVELOPMENT.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # showLastUpdateTime reads each page's last commit

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: The pages match the README and docs/
        run: |
          python3 website/sync_pages.py
          # porcelain, not git diff: it also lists pages the script added (untracked) or dropped (deleted).
          if [ -n "$(git status --porcelain -- website/docs)" ]; then
            git status --short -- website/docs
            exit 1
          fi

      - name: Build the docs site
        run: |
          cd website
          npm ci
          npx docusaurus build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - id: deployment
        uses: actions/deploy-pages@v5
