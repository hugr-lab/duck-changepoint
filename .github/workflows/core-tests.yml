#
# Numerical core under ASan/UBSan, SQL tests on the oldest supported DuckDB (1.5.6), and leak_check
# (every SQL function and the core under macOS `leaks`).
#
name: Core and compatibility tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: test_core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # ASan can hang at startup on some macOS releases; fail instead of waiting 6 h
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the Makefile includes extension-ci-tools makefiles
      - run: make test_core
      - run: make test_threads

  compat:
    name: SQL tests on DuckDB 1.5.6
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make configure
      - run: make test_compat

  leaks:
    name: leak_check (macOS leaks)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libduckdb
        run: brew install duckdb
      - run: make configure
      - run: make leak_check
      - name: Upload leaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaks-reports
          path: build/leaks_*.txt
          if-no-files-found: ignore
