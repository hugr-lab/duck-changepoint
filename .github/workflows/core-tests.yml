#
# Numerical core under ASan/UBSan and ThreadSanitizer, leak_check (every SQL function and the core under
# macOS `leaks`) and the CRAP gate. The last two build DuckDB from the submodule. The SQL tests on DuckDB
# 1.5.x run on the v1.5.x branch, which keeps the stable C API build.
#
name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: test_core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # ASan can hang at startup on some macOS releases; fail instead of waiting 6 h
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the Makefile includes extension-ci-tools makefiles
      - run: make test_core
      - run: make test_threads

  leaks:
    name: leak_check (macOS leaks)
    runs-on: macos-latest
    timeout-minutes: 90   # builds DuckDB (reldebug) from the submodule
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - run: GEN=ninja make leak_check
      - name: Upload leaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaks-reports
          path: build/leaks_*.txt
          if-no-files-found: ignore

  crap:
    name: CRAP < 10 for every C and C++ function
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - run: make crap
